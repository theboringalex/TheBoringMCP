name: "TheBoringMCP"
version: "2.0.1"
slug: "theboringmcp"
description: "One MCP server for Claude: Home Assistant, Sonarr, Radarr, SABnzbd, Jellyfin, Portainer, UniFi and n8n – with on/off switch per app"
url: "https://github.com/theboringalex/TheBoringMCP"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-happy-outline"
panel_title: "TheBoringMCP"
host_network: false
ports:
  17820/tcp: 17820
ports_description:
  17820/tcp: "MCP Streamable-HTTP endpoint (Bearer token)"
options:
  mcp_http_token: ""
  read_only: false
  ha_enabled: true
  ha_url: ""
  ha_token: ""
  sonarr_enabled: true
  sonarr_url: ""
  sonarr_api_key: ""
  radarr_enabled: true
  radarr_url: ""
  radarr_api_key: ""
  sabnzbd_enabled: true
  sabnzbd_url: ""
  sabnzbd_api_key: ""
  jellyfin_enabled: true
  jellyfin_url: ""
  jellyfin_api_key: ""
  portainer_enabled: true
  portainer_url: ""
  portainer_api_key: ""
  portainer_insecure_tls: true
  unifi_enabled: true
  unifi_url: ""
  unifi_api_key: ""
  unifi_insecure_tls: true
  n8n_enabled: true
  n8n_url: ""
  n8n_api_key: ""
schema:
  mcp_http_token: "password?"
  read_only: "bool"
  ha_enabled: "bool"
  ha_url: "str?"
  ha_token: "password?"
