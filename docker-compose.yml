# TheBoringMCP v2 – standalone Docker container (independent of the Home Assistant add-on).
# Eigenständiger Docker-Container (unabhängig vom Home-Assistant-Add-on).
#
#   Start / Start:   docker compose up -d --build
#
# Then the MCP server is reachable at / Danach erreichbar unter:  http://<host>:17820/
# (Header: Authorization: Bearer <MCP_HTTP_TOKEN>)
#
# No .env file needed: put your values directly below. / Keine .env-Datei nötig: Werte direkt unten eintragen.
# Set <APP>_ENABLED to "false" to switch an app off. / <APP>_ENABLED auf "false" = App ausschalten.
services:
  theboringmcp:
    build:
      context: .
      args:
        BUILD_FROM: node:20-alpine
    container_name: theboringmcp
    restart: unless-stopped
    ports:
      - "17820:17820"
    environment:
      TRANSPORT: "http"
      PORT: "17820"
      MCP_HTTP_TOKEN: "CHANGE_ME"
      READ_ONLY: "false"

      HA_ENABLED: "true"
      HA_URL: "http://192.168.1.11:8123"
      HA_TOKEN: "CHANGE_ME"

      SONARR_ENABLED: "true"
      SONARR_URL: "http://192.168.1.20:8989"
      SONARR_API_KEY: "CHANGE_ME"

      RADARR_ENABLED: "true"
      RADARR_URL: "http://192.168.1.20:7878"
      RADARR_API_KEY: "CHANGE_ME"

      SABNZBD_ENABLED: "true"
      SABNZBD_URL: "http://192.168.1.20:8080"
      SABNZBD_API_KEY: "CHANGE_ME"

      JELLYFIN_ENABLED: "true"
      JELLYFIN_URL: "http://192.168.1.20:8096"
      JELLYFIN_API_KEY: "CHANGE_ME"

      PORTAINER_ENABLED: "true"
      PORTAINER_URL: "https://192.168.1.20:9443"
      PORTAINER_API_KEY: "CHANGE_ME"
      PORTAINER_INSECURE_TLS: "true"

      UNIFI_PROTECT_ENABLED: "true"
      UNIFI_PROTECT_URL: "https://192.168.1.1"
      UNIFI_PROTECT_API_KEY: "CHANGE_ME"
      UNIFI_PROTECT_INSECURE_TLS: "true"

      N8N_ENABLED: "true"
      N8N_URL: "http://192.168.1.20:5678"
      N8N_API_KEY: "CHANGE_ME"
